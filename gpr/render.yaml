services:
  - type: web
    name: gpr-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn config.wsgi:application --workers 2 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://gpr-frontend.onrender.com
      - key: DEBUG
        value: False

  - type: static_site
    name: gpr-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://gpr-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html